<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主控板-高级管理</title>
    <style>
        /* 页面样式 */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            color: #333;
            text-align: center;
        }

        /* 外部容器 */
        .container {
            max-width: 800px;
            width: 100%;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            text-align: center;
        }

        /* 输入框样式 */
        input[type="text"] {
            width: 98%;
            height: 40px;
            padding: 1% 1% 1% 1%;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
            outline: none;
            background-color: #f9f9f9;
            color: #333;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: #66afe9;
            box-shadow: 0 0 8px rgba(102, 175, 233, 0.6);
        }

        /* 按钮样式 */
        button {
            width: 40%;
            height: 40px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin: 20px 0px;
        }

        #disconnectButton {
            background-color: #db3615;
        }

        button:hover {
            background-color: #45a049;
        }

        /* 日志区域样式 */
        #log {
            margin-top: 20px;
            border: 1px solid #ccc;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            background-color: #f8f8f8;
            border-radius: 5px;
            text-align: left;
            font-size: 14px;
            color: #555;
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var ws;

            // 点击“连接”按钮后创建 WebSocket 连接
            document.getElementById('connectButton').addEventListener('click', function () {
                // var wsUrl = document.getElementById('wsUrl').value;
                // if (wsUrl === "") {
                //     // logMessage("请输入 WebSocket 地址");
                //     wsUrl = "ws://127.0.0.1:4000/ws"
                // }
                var wsUrl = "ws://127.0.0.1:4000/advanced-ws"

                ws = new WebSocket(wsUrl);

                ws.onopen = function () {
                    logMessage('连接已打开');
                };

                ws.onerror = function (error) {
                    logMessage('发生错误: ' + error);
                };

                ws.onmessage = function (event) {
                    logMessage('收到消息: ' + event.data);
                };

                ws.onclose = function () {
                    logMessage('连接已关闭');
                };
            });

            // 断开
            document.getElementById('disconnectButton').addEventListener('click', function () {
                ws.onclose = function () {
                    logMessage('连接已关闭');
                };
            });

            // 发送消息
            document.getElementById('sendButton').addEventListener('click', function () {
                var message = document.getElementById('messageInput').value;
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(message);
                    logMessage('发送消息: ' + message);
                } else {
                    logMessage('连接未打开');
                }
            });

            // 显示日志信息
            function logMessage(message) {
                var log = document.getElementById('log');
                log.innerHTML += message + '<br>';
                log.scrollTop = log.scrollHeight; // 滚动到最新消息
            }
        });
    </script>
</head>

<body>
    <div class="container">
        <h1>主控板-高级管理</h1>
        <!-- <input type="text" id="wsUrl" placeholder="输入 WebSocket 地址，如 ws://127.0.0.1:4000/ws" /> -->
        <button id="connectButton">连接</button>
        <button id="disconnectButton">断开</button>

        <input type="text" id="messageInput" placeholder="输入消息" />
        <button id="sendButton">发送</button>

        <div id="log"></div>
    </div>
</body>

</html>
