<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>主控板-高级管理</title>
    <style>
              /* 页面样式 */
              body {
                  font-family: Arial, sans-serif;
                  background-color: #f4f7f6;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  min-height: 100vh;
                  margin: 0;
              }

              h1 {
                  color: #333;
                  text-align: center;
              }

              /* 外部容器 */
              .container {
                  min-width: 800px;
                  max-width: 1080px;
                  width: 100%;
                  padding: 20px;
                  background-color: #fff;
                  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
                  border-radius: 10px;
                  text-align: center;
              }
              /* Flexbox 布局：将按钮和输入框放在一行 */
              .file-upload-container {
                  display: flex;
                  align-items: center;
                  justify-content: center;
              }

              /* 输入框样式 */
              input[type="text"] {
                  width: 90%;
                  height: 40px;
                  padding: 1% 1% 1% 1%;
                  margin: 10px 5px 10px 0;
                  font-size: 16px;
                  border-radius: 5px;
                  border: 1px solid #ccc;
                  outline: none;
                  background-color: #f9f9f9;
                  color: #333;
                  transition: all 0.3s ease;
              }

              input[type="text"]:focus {
                  border-color: #66afe9;
                  box-shadow: 0 0 8px rgba(102, 175, 233, 0.6);
              }

              /* 按钮样式 */
              button {
                  width: 40%;
                  height: 40px;
                  background-color: #4CAF50;
                  color: white;
                  border: none;
                  border-radius: 5px;
                  font-size: 16px;
                  cursor: pointer;
                  transition: background-color 0.3s ease;
                  margin: 20px 0px;
              }

              #disconnectButton {
                  background-color: #db3615;
              }

              button:hover {
                  background-color: #45a049;
              }

              /* 日志区域样式 */
              #log {
                  margin-top: 20px;
                  border: 1px solid #ccc;
                  height: 400px;
                  overflow-y: auto;
                  padding: 10px;
                  background-color: #f8f8f8;
                  border-radius: 5px;
                  text-align: left;
                  font-size: 14px;
                  color: #555;
              }
              /* 文件上传输入框样式 */
              input[type="file"] {
                  width: 90%;
                  padding: 10px;
                  margin: 10px 5px 10px 0;
                  font-size: 16px;
                  border-radius: 5px;
                  border: 1px solid #ccc;
                  background-color: #f9f9f9;
                  cursor: pointer;
                  transition: all 0.3s ease;
              }

              input[type="file"]:focus {
                  border-color: #66afe9;
                  box-shadow: 0 0 8px rgba(102, 175, 233, 0.6);
              }

              /* 自定义上传按钮 */
              input[type="file"]::-webkit-file-upload-button {
                  background-color: #4CAF50;
                  color: white;
                  border: none;
                  padding: 10px 20px;
                  border-radius: 5px;
                  font-size: 16px;
                  cursor: pointer;
                  transition: background-color 0.3s ease;
              }

              input[type="file"]::-webkit-file-upload-button:hover {
                  background-color: #45a049;
              }
              #uploadButton {
      <!--            height: 64.5px;-->
                  padding: 10px;
              }
    </style>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const fileInput = document.getElementById('upgrade');
        const uploadButton = document.getElementById('uploadButton');
        var ws;

        // 点击“连接”按钮后创建 WebSocket 连接
        document
          .getElementById("connectButton")
          .addEventListener("click", function () {
            var wsUrl = "ws://127.0.0.1:4000/advanced-ws";

            ws = new WebSocket(wsUrl);

            ws.onopen = function () {
              logMessage("连接已打开");
            };

            ws.onerror = function (error) {
              logMessage("发生错误: " + error);
            };

            ws.onmessage = function (event) {
              logMessage("收到消息: " + event.data);
            };

            ws.onclose = function () {
              logMessage("连接已关闭");
            };
          });

        // 断开
        document
          .getElementById("disconnectButton")
          .addEventListener("click", function () {
            logMessage("disconnectButton clicked.");
            ws.close();
          });

        // 发送消息
        document
          .getElementById("sendButton")
          .addEventListener("click", function () {
            var message = document.getElementById("messageInput").value;
            if (ws && ws.readyState === WebSocket.OPEN) {
              ws.send(message);
              logMessage("发送消息: " + message);
            } else {
              logMessage("连接未打开");
            }
          });

        // 显示日志信息
        function logMessage(message) {
          var log = document.getElementById("log");
          log.innerHTML += message + "<br>";
          log.scrollTop = log.scrollHeight; // 滚动到最新消息
        }

        var file;
      // 上传远程升级文件
      document
        .getElementById("upgrade")
        .addEventListener("change", function (event) {
         file = event.target.files[0];
        });

      // 上传文件
      document
        .getElementById("uploadButton")
        .addEventListener("click", function () {
          if (file) {
            uploadFile(file);
          }
        });

        // 上传文件到服务器
        function uploadFile(file) {
            var formData = new FormData();
            formData.append("file", file);

            var xhr = new XMLHttpRequest();
            xhr.open("POST", "http://127.0.0.1:4000/advanced/upgrade", true);

            xhr.onload = function () {
                if (xhr.status === 200) {
                    logMessage('文件上传成功');
                } else {
                    logMessage('文件上传失败：' + xhr.statusText);
                }
            };

            xhr.onerror = function () {
                logMessage('文件上传失败');
            };

            xhr.send(formData);
            logMessage('正在上传文件：' + file.name);
        }
      });
    </script>
  </head>

  <body>
    <div class="container">
      <h1>主控板-高级管理</h1>
      <button id="connectButton">连接</button>
      <button id="disconnectButton">断开</button>

      <div class="file-upload-container">
        <input type="file" id="upgrade" />
        <!-- 上传按钮 -->
        <button id="uploadButton">发送文件</button>
      </div>

      <div class="file-upload-container">
        <label for="messageInput"></label
        ><input type="text" id="messageInput" placeholder="输入消息" />
        <button id="sendButton">发送</button>
      </div>

      <div class="file-upload-container">
        <button id="jiaozhun">校准</button>
        <button id="zhengchang">正常</button>
      </div>

      <div id="log"></div>
    </div>
  </body>
</html>
